<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRIT — MG-N01-S04</title>
<style>
  html, body {
    margin:0; padding:0; height:100%;
    background:#F5F5F5;
    overflow:hidden;
  }
  #field { position:fixed; inset:0; }
  #field canvas {
    display:block; width:100%; height:100%;
    cursor:crosshair; touch-action:none;
  }

  /* offscreen rather than display:none — a hidden video can stop
     decoding frames, and then there is nothing to difference */
  #cam { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; pointer-events:none; }

  /* tuning overlay: the camera, with whatever counts as movement
     washed over it. D toggles it, ?exhibition starts it off. */
  #dbg {
    position:fixed; right:0; bottom:0;
    width:360px; height:270px;
    opacity:0; pointer-events:none;
  }
  body.tune #dbg { opacity:1; }
</style>
</head>
<body>
  <div id="field"><canvas id="c"></canvas></div>
  <video  id="cam" playsinline muted></video>
  <canvas id="dbg" width="360" height="270"></canvas>

<script type="module">
// Loaded only after a camera opens. Nothing is fetched on a machine
// without one, and a CDN that is down costs the hand tracking, not the
// page. Vendor these into exhibition/vendor/ before the show.
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

/* ------------------------------------------------------------------
   MG-N01-S04 — magnetic axis, speculative.

   On GRIT WHITE the field reads as a density record, not a light
   source: the shader accumulation is inverted, so mass darkens the
   paper through GREEN -> MID -> BLACK instead of glowing.

   IDLE -> PROXIMITY -> CONTACT -> RESIDUE -> RESET
------------------------------------------------------------------- */

const VERT = `#version 300 es
precision highp float;
layout(location=0) in vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FRAG = `#version 300 es
precision highp float;

out vec4 fragColor;

uniform vec3  iResolution;
uniform float iTime;
uniform vec2  uRot;        // final ray rotation (idle drift blended with pointer)
uniform vec2  uPointPx;    // pointer in framebuffer px, origin bottom-left
uniform vec2  uAnchorPx;   // last contact point, for the residue ring
uniform float uProx;       // 0..1 approach
uniform float uContact;    // 0..1 contact
uniform float uResidue;    // 0..1 decaying trace
uniform float uEnergy;     // 0..1 pointer speed
uniform float uHold;       // 0..1 scroll progress
uniform vec4  uSeed;       // this visitor's hold: layout, axis, surface, family
uniform float uSize;       // 0..1, how much material ends up in it

mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

// --- BODY ----------------------------------------------------------
// Everything above stays as it was: loose material is still the density
// march. This is only what the material becomes once it has gathered.
//
// The archive's seventeen are all one thing — a few rounded lobes fused
// into a single cast body, one dominant axis, one surface feature, and a
// back flattened because it bolts to a wall. uSeed picks a point inside
// that range, never outside it.

float hash11(float n){ return fract(sin(n * 127.1) * 43758.5453123); }

// rounded union. This is what makes it read as cast rather than as a
// pile of spheres stuck together.
float smin(float a, float b, float k){
  float w = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, w) - k * w * (1.0 - w);
}

// a segment whose radius tapers along it. FIN, GLIDER and SPROUT are all
// this shape; no arrangement of spheres reaches that silhouette.
float sdArm(vec3 p, vec3 b, float r1, float r2){
  float t = clamp(dot(p, b) / max(dot(b, b), 1e-5), 0.0, 1.0);
  return length(p - b * t) - mix(r1, r2, t);
}

float smax(float a, float b, float k){ return -smin(-a, -b, k); }

float holdSDF(vec3 pos, float h)
{
  float loose = 1.0 - h;

  pos.xz *= rot(uRot.x);
  pos.yz *= rot(uRot.y);

  // Scaling a coordinate stretches the field along it, which makes every
  // distance below an overestimate. Keep the factors — the march has to
  // divide them back out or it steps straight through the body.
  float sx = 1.0 + max(-uSeed.y, 0.0) * 0.55;   // runs long
  float sy = 1.0 + max( uSeed.y, 0.0) * 0.48;   // runs wide
  float sz = mix(1.45, 2.20, h);                // relief, it bolts to a wall

  vec3 q = pos;
  q.x *= sx; q.y *= sy; q.z *= sz;

  // still finding its body while the fist is closing
  q += vec3(sin(q.y * 2.7 + iTime * 0.6),
            cos(q.z * 2.3 - iTime * 0.5),
            sin(q.x * 2.1 + iTime * 0.4)) * loose * 0.42;

  float base = uSeed.x * 6.28318530;
  float sd;

  // Four families, because the archive has four. Varying arm counts
  // inside one family only ever produced variations on one object.
  float kind = floor(uSeed.w * 3.999);

  if (kind < 0.5) {
    // RADIAL — a hub with tapered arms. CLOVER, FIN, BUBBLE.
    // The fusion radius stays well under the arm radius; go near it and
    // the arms dissolve and the whole thing collapses to a ball.
    float lobes = floor(2.0 + fract(uSeed.x * 5.1) * 2.999);
    sd = length(q) - mix(0.26, 0.36, fract(uSeed.x * 3.3));
    for (float i = 0.0; i < 4.0; i++) {
      if (i >= lobes) break;
      float s1 = hash11(i * 7.3 + uSeed.x * 17.0);
      float s2 = hash11(i * 3.9 + uSeed.x * 11.0);
      float ang = 6.28318530 * (i / lobes) + base + (s1 - 0.5) * 1.15;
      vec3  dir = vec3(cos(ang), sin(ang), (s1 - 0.5) * 0.34) * mix(0.56, 1.06, s2);
      sd = smin(sd, sdArm(q, dir, mix(0.24, 0.34, s2), mix(0.06, 0.19, s1)), 0.16);
    }

  } else if (kind < 1.5) {
    // BLADE — one long body, thick at the middle, thin at the ends.
    // SPROUT, GLIDER, SLOPE. The most directional silhouette there is.
    vec3 dir = vec3(cos(base), sin(base), 0.0);
    float hub  = mix(0.28, 0.40, fract(uSeed.x * 5.1));
    float back = mix(0.30, 0.95, fract(uSeed.x * 7.3));   // asymmetric on purpose
    sd = sdArm(q,  dir * mix(0.80, 1.25, fract(uSeed.x * 9.7)), hub, mix(0.04, 0.13, uSeed.z));
    sd = smin(sd, sdArm(q, -dir * back, hub, mix(0.07, 0.22, fract(uSeed.x * 2.9))), 0.20);

  } else if (kind < 2.5) {
    // SCOOP — a body with a bite taken out. SHELL, VALLEY, CUSHION.
    // The concave face is what your hand actually catches on.
    float rb = mix(0.60, 0.84, fract(uSeed.x * 3.3));
    vec3  e  = vec3(1.0, mix(0.74, 1.26, fract(uSeed.x * 6.1)), 1.0);
    float body = length(q / e) - rb;
    vec3  c = vec3(cos(base), sin(base), -0.62) * mix(0.46, 0.86, fract(uSeed.x * 9.1));
    float bite = length(q - c) - rb * mix(0.70, 1.02, fract(uSeed.x * 4.3));
    sd = smax(body, -bite, 0.13);

  } else {
    // STACK — two or three lumps resting on each other. KNOT, MELT,
    // RIPPLE. Fused just enough to be one object, not enough to merge.
    float count = 2.0 + step(0.55, fract(uSeed.x * 4.7));
    sd = 1e9;
    for (float i = 0.0; i < 3.0; i++) {
      if (i >= count) break;
      float s1 = hash11(i * 5.7 + uSeed.x * 13.0);
      float s2 = hash11(i * 2.3 + uSeed.x * 19.0);
      float ang = base + i * 2.4 + (s1 - 0.5);
      vec3  c = vec3(cos(ang), sin(ang), (s2 - 0.5) * 0.5) * mix(0.20, 0.62, s2);
      sd = smin(sd, length(q - c) - mix(0.32, 0.54, s1), 0.10);
    }
  }

  // one feature, not a texture. VEIL stays smooth, CRUMPLE keeps a crease.
  float feature = sin(q.x * 4.1 + base) * sin(q.y * 3.5 - base * 0.7)
                + sin(q.z * 5.2 + base * 0.3) * 0.4;
  sd -= feature * mix(0.008, 0.055, uSeed.z) * h;

  // and here is the division. The view looks straight down the squashed
  // axis, so without it the body is invisible exactly when it is most
  // flattened — which is when it has finished gathering.
  return sd / max(max(sx, sy), sz);
}

vec3 holdNormal(vec3 pos, float h)
{
  vec2 e = vec2(0.0016, 0.0);
  return normalize(vec3(
    holdSDF(pos + e.xyy, h) - holdSDF(pos - e.xyy, h),
    holdSDF(pos + e.yxy, h) - holdSDF(pos - e.yxy, h),
    holdSDF(pos + e.yyx, h) - holdSDF(pos - e.yyx, h)));
}

void mainImage(out vec4 fragColor, in vec2 fragCoord)
{
  vec2  r  = iResolution.xy;
  float t  = iTime;
  vec3  FC = vec3(fragCoord, t);
  vec4  o  = vec4(0.0);

  vec3 p, a;
  float z = 0.0;
  float d = 0.0;

  // frame width. Higher = wider view = the mass sits smaller in frame.
  const float FOV = 2.10;

  vec3 rd = FC.rgb * 2.0 - r.xyy;
  rd.xy *= FOV;
  vec3 dir = normalize(rd);
  dir.xz *= rot(uRot.x);
  dir.yz *= rot(uRot.y);

  float h     = smoothstep(0.02, 0.98, uHold);
  float pull  = uContact * 2.0 + uResidue * 0.55;

  // the extent is what makes the gathering readable: loose material spans
  // most of the frame, the packed mass is about a third of it
  // the left hand's pinch decides how much material the hold keeps
  float packed = mix(2.10, 3.75, uSize);
  float radius = mix(6.6, packed, h) + uContact * 1.15 + uResidue * 0.30;
  float agit  = uEnergy * 2.2 + uResidue * 0.9 + uProx * 0.5;

  // --- SEED. The archive's own seventeen set the range, nothing wider:
  // one to four rounded lobes, a single dominant axis, one surface
  // feature, and a back that flattens because it mounts to a wall.

  // where the lobes sit. This is the whole silhouette — CLOVER's four
  // arms and KNOT's two crossing lumps differ only here.
  vec3 axis = vec3(4.0, 2.0, 0.0) + uSeed.x * vec3(2.7, 1.9, 3.3);

  // scaling a coordinate up compresses the mass along it. Negative seed
  // runs it long like SPROUT, positive runs it flat and wide like RAY.
  float stretchX = mix(1.0, 1.0  + max(-uSeed.y, 0.0) * 0.55, h);
  float stretchY = mix(1.0, 1.12 + max( uSeed.y, 0.0) * 0.42, h);

  // this is what does the gathering. Over 1.0 the folding overwhelms the
  // shell and it breaks into separate scattered lobes; dropping toward 0.2
  // merges them into one mass, with just enough relief left to read as a hold.
  // VEIL and CUSHION settle almost smooth; CRUMPLE, WHORL and RIPPLE
  // keep their relief. Above 0.4 it stops reading as one hold.
  float fold  = mix(1.62, mix(0.07, 0.36, uSeed.z), h);

  for (float i = 0.0; i < 100.0; i++)
  {
    p = z * dir;
    a = normalize(cos(axis + t - d * 10.0 + agit));
    p.z += 8.0 - pull;
    p.x *= stretchX;
    p.y *= stretchY;            // settles wider than tall
    p.z *= mix(1.0, 1.22, h);   // and shallower, so it sits like relief
    a = a * dot(a, p) - cross(a, p);
    for (float k = 1.0; k < 5.0; k += 1.0) {
      a += sin(a * k + t + agit * 0.8).yzx / k * fold;
    }
    d = abs(length(a) - radius) / 6.0;
    z += d;
    o += vec4(3.0, 8.0, z, 0.0) / max(d, 1e-4) / 9e4;
  }

  // --- GRIT COLOR
  vec3 WHITE = vec3(0.961, 0.961, 0.961);
  vec3 BLACK = vec3(0.004, 0.004, 0.004);
  vec3 MID   = vec3(0.682, 0.714, 0.749);
  vec3 GREEN = vec3(0.796, 0.843, 0.831);

  // density, not luminance: the accumulation is inverted onto paper
  float e = o.r * 0.34 + o.g * 0.50 + o.b * 0.16;
  e = 1.0 - exp(-e * mix(1.32, 2.10, h));   // thin and dusty up top, solid at the end

  // The march leaves a faint accumulation on every pixel it passes
  // through, including the empty ones. Cut it away, or the whole sheet
  // tints and there is no white left for the hold to sit on.
  e = max(0.0, e - 0.12);

  vec3 col = mix(WHITE, GREEN, smoothstep(0.00, 0.16, e));
  col = mix(col, MID,   smoothstep(0.14, 0.46, e));
  col = mix(col, BLACK, smoothstep(0.44, 0.86, e));

  // grain only where there is material. On bare paper it would be the
  // one thing keeping the ground from being exactly GRIT WHITE.
  col += (hash21(fragCoord + fract(t) * 91.7) - 0.5) * 0.011 * smoothstep(0.0, 0.04, e);

  // --- the body condenses out of the dust as the fist closes.
  // Below h it is not drawn at all, so nothing about the loose state
  // changes — this only ever adds on top of what gathered.
  if (h > 0.004) {
    vec2  suv  = (fragCoord * 2.0 - r) / r.y;
    float bulk = mix(0.80, 1.30, uSize);
    vec3  sro  = vec3(0.0, 0.0, -3.15 / bulk);
    vec3  srd  = normalize(vec3(suv, 1.75));

    float sz = 0.0, sdist = 1.0;
    bool  shit = false;
    for (int i = 0; i < 80; i++) {
      sdist = holdSDF((sro + srd * sz) * bulk, h) / bulk;
      if (sdist < 0.0013) { shit = true; break; }
      sz += sdist * 0.78;
      if (sz > 7.0) break;
    }

    if (shit) {
      vec3 sn = holdNormal((sro + srd * sz) * bulk, h);

      // one key from the upper left, the way the archive was shot.
      // Matte only — a highlight is the one thing that reads as plastic.
      vec3  key  = normalize(vec3(-0.46, 0.72, -0.52));
      float dif  = max(dot(sn, key), 0.0);
      float wrap = max(dot(sn, key) * 0.5 + 0.5, 0.0);
      float rim  = 1.0 - max(dot(sn, -srd), 0.0);
      float lum  = 0.10 + dif * 0.56 + wrap * wrap * 0.30 - rim * rim * 0.22;

      // still ink on paper, not light: a lit face takes less of it
      float ink = clamp(1.0 - lum, 0.0, 1.0);
      vec3 solid = mix(WHITE, GREEN, smoothstep(0.06, 0.34, ink));
      solid = mix(solid, MID,   smoothstep(0.30, 0.64, ink));
      solid = mix(solid, BLACK, smoothstep(0.60, 0.94, ink));

      col = mix(col, solid, h);
    }
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}

void main(){ mainImage(fragColor, gl_FragCoord.xy); }
`;

const EXHIBITION = new URLSearchParams(location.search).has("exhibition");
if (EXHIBITION) document.body.classList.add("exhibition");

const RESET_AFTER   = EXHIBITION ? 45000 : 90000;  // ms of no input before reset
const RESIDUE_DECAY = 0.16;                        // per second, ~7s tail

const canvas  = document.getElementById("c");
const fieldEl = document.getElementById("field");
const stateEl = document.getElementById("state");
const gl = canvas.getContext("webgl2", { premultipliedAlpha: false, antialias: false });

if (!gl) {
  fieldEl.innerHTML =
    '<div class="m" style="padding:20px">RECORD UNAVAILABLE / WEBGL2 NOT SUPPORTED</div>';
} else {

  const compile = (type, src) => {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(sh)); gl.deleteShader(sh); return null;
    }
    return sh;
  };

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U("iResolution"), uTime = U("iTime"), uRot = U("uRot"),
        uPointPx = U("uPointPx"), uAnchorPx = U("uAnchorPx"),
        uProx = U("uProx"), uContact = U("uContact"),
        uResidue = U("uResidue"), uEnergy = U("uEnergy"),
        uHold = U("uHold"), uSeed = U("uSeed"), uSize = U("uSize");


  // ---- state -------------------------------------------------------
  let ftime = 0;

  const S = {
    nx:0, ny:0, tnx:0, tny:0,           // pointer, field-normalized (-1..1)
    px:0, py:0, tpx:0, tpy:0,           // pointer, css px, field-local, y up
    ax:0, ay:0,                         // residue anchor
    prox:0, tprox:0,
    contact:0, tcontact:0,
    residue:0,
    energy:0,
    down:0, hold:0,
    seed:[0, 0, 0, 0], armed:true, size:0.5,
    lastX:0, lastY:0, seen:false,
    lastInput: performance.now(),
    label:"IDLE"
  };

  // One hold per visitor. Rolled when the field goes from empty to
  // occupied, never while a mass is still on screen — nobody watches
  // their own hold change shape under them.
  function rollSeed(){
    S.seed[0] = Math.random();
    S.seed[1] = Math.random() * 2 - 1;
    S.seed[2] = Math.random();
    S.seed[3] = Math.random();
  }
  rollSeed();

  // radial bands, in units of frame height, measured from the centre
  const R_PROX = 0.80, R_CONTACT = 0.42, R_CORE = 0.20;

  const smoothstep = (a, b, x) => {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  function onPointer(e){
    if (Sense.on) return;          // the camera has the floor
    const r = fieldEl.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;

    const rd = Math.hypot(x - r.width / 2, y - r.height / 2) / r.height;
    S.tprox    = 1 - smoothstep(R_CONTACT, R_PROX,    rd);
    S.tcontact = 1 - smoothstep(R_CORE,    R_CONTACT, rd);
    const inside = rd < R_CONTACT;

    if (S.seen) {
      const sp = Math.hypot(x - S.lastX, y - S.lastY) / Math.max(1, r.height);
      S.energy = Math.min(1, S.energy + sp * 3.0);
    }
    S.lastX = x; S.lastY = y; S.seen = true;
    S.lastInput = performance.now();

    S.tnx = (x / r.width)  * 2 - 1;
    S.tny = (y / r.height) * 2 - 1;
    S.tpx = x;
    S.tpy = r.height - y;

    if (inside) { S.ax = S.tpx; S.ay = S.tpy; S.residue = Math.max(S.residue, 0.85); }
    if (EXHIBITION) document.body.classList.remove("dim");
  }

  window.addEventListener("pointermove", onPointer, { passive:true });
  window.addEventListener("pointerdown", (e) => {
    onPointer(e); S.residue = 1;
    if (e.button === 0) S.down = 1;     // hold to gather
  }, { passive:true });
  window.addEventListener("pointerup",     () => { S.down = 0; });
  window.addEventListener("pointercancel", () => { S.down = 0; });
  window.addEventListener("pointerleave", () => {
    S.tprox = 0; S.tcontact = 0; S.tnx = 0; S.tny = 0; S.down = 0;
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  // wheel does the left hand's job, R brings the next visitor
  addEventListener("wheel", e => {
    if (Sense.on) return;
    S.size = Math.min(1, Math.max(0, S.size - e.deltaY * 0.0015));
  }, { passive:true });

  addEventListener("keydown", e => {
    if (Sense.on) return;
    if (e.key === "r" || e.key === "R" || e.key === " ") { e.preventDefault(); rollSeed(); }
  });

  // ---- hands -------------------------------------------------------
  // MediaPipe HandLandmarker: 21 joints per hand, up to two, each with a
  // left/right label. Every reading below is a joint distance divided by
  // the hand's own width, so none of it shifts when the visitor stands
  // closer to or further from the camera — only the gesture moves it.
  //
  //   grip    right hand, fingertips drawn toward the palm  -> gathering
  //   pinch   left hand, thumb tip to index tip             -> size
  //   x, y    right hand centre, mirrored to match the room
  //   energy  how fast that hand is travelling
  //
  // The labels come back assuming a mirrored image. If the two hands
  // turn out swapped in the room, flip this and nothing else.
  const HAND_FLIP = false;

  // measured in hand widths (wrist to middle knuckle), so they hold at
  // any distance. Read the live numbers off the D overlay to retune.
  const GRIP_OPEN  = 2.30, GRIP_SHUT = 1.20;
  const PINCH_SHUT = 0.30, PINCH_OPEN = 1.40;

  const Sense = {
    on:false, denied:false, note:"OPENING CAMERA",
    grip:0, pinch:0.5, x:0.5, y:0.5, energy:0, present:0,
    lastX:0.5, lastY:0.5, seen:false, lastFrame:-1,
    hands:[]
  };

  const camEl = document.getElementById("cam");
  const dbgEl = document.getElementById("dbg");
  const DW = 360, DH = 270;
  const dbgCtx = dbgEl.getContext("2d");

  let landmarker = null;

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
  const norm = (v, lo, hi) => Math.min(1, Math.max(0, (v - lo) / (hi - lo)));

  // wrist to middle knuckle. The one length on a hand that barely moves
  // whatever the fingers are doing, so it is the unit for everything else.
  const handWidth = L => Math.max(1e-4, dist(L[0], L[9]));

  // open hand holds its fingertips about two hand widths from the wrist;
  // a closed fist brings them to roughly one
  function gripOf(L){
    const w = handWidth(L);
    const reach = (dist(L[8], L[0]) + dist(L[12], L[0]) + dist(L[16], L[0]) + dist(L[20], L[0])) / (4 * w);
    return 1 - norm(reach, GRIP_SHUT, GRIP_OPEN);
  }

  const pinchOf = L => norm(dist(L[4], L[8]) / handWidth(L), PINCH_SHUT, PINCH_OPEN);

  async function startHands(){
    if (new URLSearchParams(location.search).has("mouse")) {
      Sense.denied = true; Sense.note = "POINTER"; return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      Sense.denied = true; Sense.note = "NO CAMERA API"; return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{ width:640, height:480, facingMode:"user" }, audio:false
      });
      camEl.srcObject = stream;
      await camEl.play();
    } catch (err) {
      Sense.denied = true; Sense.note = "NO CAMERA / " + err.name;
      console.warn("camera unavailable, pointer fallback:", err.name);
      return;
    }
    let fileset, FilesetResolver, HandLandmarker;
    try {
      Sense.note = "LOADING RUNTIME";
      ({ FilesetResolver, HandLandmarker } = await import(VISION + "/vision_bundle.mjs"));
      fileset = await FilesetResolver.forVisionTasks(VISION + "/wasm");
    } catch (err) {
      Sense.denied = true;
      Sense.note = "WASM FAILED / " + String(err && err.message || err).slice(0, 40);
      console.error("hand runtime failed:", err);
      return;
    }

    // the page already holds a WebGL2 context of its own, and the GPU
    // delegate does not always survive sharing a machine with it. CPU is
    // slower but it is the difference between working and not.
    Sense.note = "LOADING MODEL";
    for (const delegate of ["GPU", "CPU"]) {
      try {
        landmarker = await HandLandmarker.createFromOptions(fileset, {
          baseOptions:{ modelAssetPath: MODEL_URL, delegate },
          numHands: 2,
          runningMode: "VIDEO"
        });
        Sense.on = true;
        console.info("hand model running on", delegate);
        return;
      } catch (err) {
        Sense.note = delegate + " FAILED / " + String(err && err.message || err).slice(0, 40);
        console.error("hand model failed on", delegate, err);
      }
    }
    Sense.denied = true;
  }
  startHands();

  const DIFF_FLOOR = 0;      // kept out of the way; nothing reads it now
  let tune = !EXHIBITION;
  document.body.classList.toggle("tune", tune);

  addEventListener("keydown", e => {
    if (e.key === "d" || e.key === "D") {
      tune = !tune;
      document.body.classList.toggle("tune", tune);
    }
  });

  // the overlay has to say which of the several ways this can fail
  // happened, or a blocked camera and a broken page look the same.
  // Tuning overlay only — it never reaches the exhibition screen.
  function senseIdle(){
    if (!tune) return;
    if (camEl.readyState >= 2) {
      dbgCtx.save();
      dbgCtx.setTransform(-1, 0, 0, 1, DW, 0);
      dbgCtx.drawImage(camEl, 0, 0, DW, DH);
      dbgCtx.restore();
      dbgCtx.fillStyle = "#F5F5F5";
      dbgCtx.fillRect(0, 0, DW, 40);
    } else {
      dbgCtx.fillStyle = "#F5F5F5";
      dbgCtx.fillRect(0, 0, DW, DH);
    }
    dbgCtx.fillStyle = "#010101";
    dbgCtx.font = "11px monospace";
    const words = String(Sense.note).split(" ");
    let line = "", y = 20;
    for (const w of words) {
      const next = line ? line + " " + w : w;
      if (dbgCtx.measureText(next).width > DW - 16 && line) {
        dbgCtx.fillText(line, 8, y); y += 14; line = w;
      } else line = next;
    }
    if (line) dbgCtx.fillText(line, 8, y);

    dbgCtx.fillStyle = "#F5F5F5";
    dbgCtx.fillRect(0, DH - 16, DW, 16);
    dbgCtx.fillStyle = "#010101";
    dbgCtx.fillText(
      "hold " + S.hold.toFixed(2) + "  size " + S.size.toFixed(2) +
      "  seed " + S.seed.map(v => v.toFixed(2)).join("/"), 5, DH - 5);
  }

  function sense(sec){
    if (!landmarker || camEl.readyState < 2) return;

    // detectForVideo wants one call per decoded frame and a rising clock
    if (camEl.currentTime === Sense.lastFrame) { drawTune(); return; }
    Sense.lastFrame = camEl.currentTime;

    let result;
    try {
      result = landmarker.detectForVideo(camEl, performance.now());
    } catch (err) { return; }

    const found = [];
    for (let i = 0; i < result.landmarks.length; i++) {
      const label = result.handedness[i] && result.handedness[i][0]
        ? result.handedness[i][0].categoryName : "Right";
      const side = (label === "Right") !== HAND_FLIP ? "R" : "L";
      found.push({ side, lm: result.landmarks[i] });
    }
    Sense.hands = found;

    const right = found.find(h => h.side === "R");
    const left  = found.find(h => h.side === "L");

    const k = 1 - Math.pow(0.02, sec);
    const kp = 1 - Math.pow(0.05, sec);

    // the right hand does the gathering and carries the position
    if (right) {
      const target = gripOf(right.lm);
      Sense.grip += (target - Sense.grip) * k;

      const c = right.lm[9];
      const sx = 1 - c.x, sy = c.y;        // mirrored, so right means right
      if (Sense.seen) {
        const speed = Math.hypot(sx - Sense.lastX, sy - Sense.lastY) / Math.max(sec, 1e-3);
        Sense.energy = Math.min(1, Sense.energy * 0.82 + speed * 0.35);
      }
      Sense.lastX = sx; Sense.lastY = sy; Sense.seen = true;
      Sense.x += (sx - Sense.x) * k;
      Sense.y += (sy - Sense.y) * k;
    } else {
      Sense.grip += (0 - Sense.grip) * k;
      Sense.energy *= Math.pow(0.2, sec);
      Sense.seen = false;
    }

    // the left hand only sets the size, and holds it when it drops out
    if (left) {
      const target = pinchOf(left.lm);
      Sense.pinch += (target - Sense.pinch) * k;
    }

    Sense.present += ((found.length ? 1 : 0) - Sense.present) * kp;
    drawTune();
  }

  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
                 [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

  function drawTune(){
    if (!tune) return;
    dbgCtx.save();
    dbgCtx.setTransform(-1, 0, 0, 1, DW, 0);
    dbgCtx.drawImage(camEl, 0, 0, DW, DH);
    dbgCtx.restore();

    for (const h of Sense.hands) {
      const P = i => [(1 - h.lm[i].x) * DW, h.lm[i].y * DH];
      dbgCtx.strokeStyle = h.side === "R" ? "#010101" : "#CBD7D4";
      dbgCtx.lineWidth = 1.5;
      dbgCtx.beginPath();
      for (const [a, b] of BONES) {
        const p = P(a), q = P(b);
        dbgCtx.moveTo(p[0], p[1]); dbgCtx.lineTo(q[0], q[1]);
      }
      dbgCtx.stroke();
      dbgCtx.fillStyle = dbgCtx.strokeStyle;
      const w = P(0);
      dbgCtx.font = "10px monospace";
      dbgCtx.fillText(h.side, w[0] + 4, w[1] + 12);
    }

    dbgCtx.fillStyle = "#F5F5F5";
    dbgCtx.fillRect(0, DH - 16, DW, 16);
    dbgCtx.fillStyle = "#010101";
    dbgCtx.font = "11px monospace";
    dbgCtx.fillText(
      "grip " + Sense.grip.toFixed(2) + "  pinch " + Sense.pinch.toFixed(2) +
      "  hands " + Sense.hands.map(h => h.side).join("") +
      "  seed " + S.seed.map(v => v.toFixed(2)).join("/"), 5, DH - 5);
  }

  function resetAll(){
    S.tprox = S.tcontact = 0;
    S.tnx = S.tny = 0;
    S.residue = 0; S.energy = 0; S.seen = false; S.down = 0;
    if (EXHIBITION) document.body.classList.add("dim");
  }

  // ---- sizing ------------------------------------------------------
  let scale = 1.0, cssW = 1, cssH = 1;
  function applySize(){
    const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    cssW = canvas.clientWidth; cssH = canvas.clientHeight;
    const w = Math.max(1, Math.floor(cssW * dpr * scale));
    const h = Math.max(1, Math.floor(cssH * dpr * scale));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  new ResizeObserver(applySize).observe(canvas);
  applySize();
  S.px = S.tpx = S.ax = cssW / 2;
  S.py = S.tpy = S.ay = cssH / 2;

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- loop --------------------------------------------------------
  let raf = 0, t0 = performance.now(), prev = t0, avgDt = 16.7;

  function tick(now){
    const dt = Math.min(64, now - prev); prev = now;
    const sec = dt / 1000;

    if (Sense.on) {
      sense(sec);

      // a hand in frame is the approach. Closing it is the hold —
      // there is no button, the fist is the button.
      S.tprox    = Sense.present;
      S.tcontact = Sense.grip;
      S.down     = Sense.grip;

      S.tnx = Sense.x * 2 - 1;
      S.tny = Sense.y * 2 - 1;
      S.tpx = Sense.x * cssW;
      S.tpy = (1 - Sense.y) * cssH;   // the shader wants y up
      S.energy = Sense.energy;

      // the left hand keeps its last size when it leaves the frame
      S.size += (Sense.pinch - S.size) * (1 - Math.pow(0.05, sec));

      if (Sense.grip > 0.5) {
        S.ax = S.tpx; S.ay = S.tpy;
        S.residue = Math.max(S.residue, 0.85);
      }
      if (Sense.present > 0.02) S.lastInput = now;
    } else {
      senseIdle();
    }


    if (S.prox < 0.02) S.armed = true;
    else if (S.armed && S.prox > 0.05 && S.hold < 0.05) { rollSeed(); S.armed = false; }

    if (now - S.lastInput > RESET_AFTER) resetAll();

    const k  = 1 - Math.pow(0.001, sec);
    const ks = 1 - Math.pow(1e-7, sec);
    S.nx += (S.tnx - S.nx) * k;
    S.ny += (S.tny - S.ny) * k;
    S.px += (S.tpx - S.px) * k;
    S.py += (S.tpy - S.py) * k;
    S.prox    += (S.tprox    - S.prox)    * k;
    S.contact += (S.tcontact - S.contact) * ks;
    if (!Sense.on) S.energy *= Math.pow(0.12, sec);

    // asymmetric: ~1s to gather, ~0.6s to break apart again
    S.hold += (S.down - S.hold) * (1 - Math.pow(S.down > S.hold ? 0.07 : 0.004, sec));

    // the field's own clock slows as it settles, so the churn winds down
    // instead of being cut off
    ftime += sec * (reduceMotion ? 0.3 : 1) * (1.0 - 0.93 * S.hold);
    const t = ftime;

    if (S.tcontact < 0.5) S.residue = Math.max(0, S.residue - RESIDUE_DECAY * sec);

    const idleX = reduceMotion ? 0 : Math.sin(t * 0.17) * 0.20;
    const idleY = reduceMotion ? 0 : Math.cos(t * 0.12) * 0.10;
    const rx = idleX * (1 - S.prox) + (S.nx *  0.92) * S.prox;
    const ry = idleY * (1 - S.prox) + (S.ny * -0.55) * S.prox;

    const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
    const rs = dpr * scale;

    gl.uniform3f(uRes, canvas.width, canvas.height, dpr);
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRot, rx, ry);
    gl.uniform2f(uPointPx, S.px * rs, S.py * rs);
    gl.uniform2f(uAnchorPx, S.ax * rs, S.ay * rs);
    gl.uniform1f(uProx, S.prox);
    gl.uniform1f(uContact, S.contact);
    gl.uniform1f(uResidue, S.residue);
    gl.uniform1f(uEnergy, S.energy);
    gl.uniform1f(uHold, S.hold);
    gl.uniform4f(uSeed, S.seed[0], S.seed[1], S.seed[2], S.seed[3]);
    gl.uniform1f(uSize, S.size);

    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    let label = "IDLE";
    if (S.contact > 0.4)       label = "CONTACT";
    else if (S.prox > 0.12)    label = "PROXIMITY";
    else if (S.residue > 0.02) label = "RESIDUE";
    if (label !== S.label && stateEl) { stateEl.textContent = label; S.label = label; }

    // 100 raymarch steps is heavy on integrated GPUs
    avgDt += (dt - avgDt) * 0.05;
    if (avgDt > 26 && scale > 0.55)     { scale -= 0.06; applySize(); }
    else if (avgDt < 15 && scale < 1.0) { scale = Math.min(1, scale + 0.03); applySize(); }

    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { prev = performance.now(); raf = requestAnimationFrame(tick); }
  });
}
</script>
</body>
</html>
